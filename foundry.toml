# GODS OF IMD contracts. bytecode_hash = "none" is what IMD's launch needs to rebuild and attest the exact bytecode.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
bytecode_hash = "none"
